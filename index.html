
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumora AI - Video Creator</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3efff;color:#30264a}
header{padding:22px 7%;background:#fff;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:25px;font-weight:bold;color:#7955c8}
main{max-width:850px;margin:45px auto;padding:25px}
.card{background:white;padding:28px;border-radius:20px;box-shadow:0 8px 30px #4c36721a;margin-bottom:20px}
h1{font-size:34px;margin-bottom:8px}
p{color:#766d88;line-height:1.5}
input,textarea,select{width:100%;padding:13px;margin:8px 0 17px;border:1px solid #ddd4ee;border-radius:10px;font-size:15px}
textarea{min-height:120px;resize:vertical}
button{border:0;border-radius:10px;padding:13px 20px;background:#7955c8;color:white;font-size:15px;cursor:pointer;margin:5px 5px 5px 0}
button:disabled{opacity:.5;cursor:not-allowed}
.secondary{background:#eee8fa;color:#563a91}
#app{display:none}
#message{padding:12px;background:#f4f0fc;border-radius:10px;overflow-wrap:anywhere}
small{color:#8a8199}
</style>
</head>
<body>
<header>
<div class="logo">✦ Lumora AI</div>
<button class="secondary" id="logout" style="display:none">Log out</button>
</header>

<main>
<section class="card" id="auth">
<h1>Welcome to Lumora AI</h1>
<p>Sign in or create an account to start making videos.</p>
<label>Email</label>
<input id="email" type="email" placeholder="Your email">
<label>Password</label>
<input id="password" type="password" placeholder="Your password">
<button id="signup">Create account</button>
<button class="secondary" id="login">Sign in</button>
<p id="authMessage"></p>
</section>

<section class="card" id="app">
<h1>Create your video ✨</h1>
<p>Describe the video you want Lumora AI to create.</p>

<label>Video prompt</label>
<textarea id="prompt" maxlength="10000" placeholder="Describe your video scene..."></textarea>

<label>Visual style</label>
<select id="style">
<option>Realistic</option>
<option>Cinematic</option>
<option>Business advertisement</option>
<option>Educational</option>
<option>Islamic reminder</option>
<option>Social media</option>
<option>Animated</option>
</select>

<label>Video length</label>
<select id="duration">
<option value="5">5 seconds</option>
<option value="8">8 seconds</option>
<option value="10">10 seconds</option>
</select>

<label>Video format</label>
<select id="ratio">
<option value="1280:720">Landscape (16:9)</option>
<option value="720:1280">Portrait (9:16)</option>
</select>

<button id="generate">Generate video</button>
<div id="message">Your video task information will appear here.</div>
<small>This starts a Runway generation task. The MP4 download feature is not connected yet.</small>
</section>
</main>

<script>
const SUPABASE_URL = "https://mlvbspwzwvynpremehel.supabase.co";
const SUPABASE_KEY = sb_publishable_-oc4IXGH5eEjyom6MgJTjQ_J0rQPhaZ

const client = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const authBox = document.getElementById("auth");
const appBox = document.getElementById("app");
const authMessage = document.getElementById("authMessage");
const message = document.getElementById("message");
const logoutButton = document.getElementById("logout");

async function refreshSession() {
  const { data: { session } } = await client.auth.getSession();
  authBox.style.display = session ? "none" : "block";
  appBox.style.display = session ? "block" : "none";
  logoutButton.style.display = session ? "block" : "none";
}

document.getElementById("signup").onclick = async () => {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  const { error } = await client.auth.signUp({ email, password });
  authMessage.textContent = error ? error.message :
    "Account request sent. Check your email if confirmation is required.";
};

document.getElementById("login").onclick = async () => {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  const { error } = await client.auth.signInWithPassword({ email, password });
  authMessage.textContent = error ? error.message : "Signed in!";
  await refreshSession();
};

logoutButton.onclick = async () => {
  await client.auth.signOut();
  await refreshSession();
};

document.getElementById("generate").onclick = async () => {
  const prompt = document.getElementById("prompt").value.trim();
  const duration = Number(document.getElementById("duration").value);
  const aspectRatio = document.getElementById("ratio").value;
  const style = document.getElementById("style").value;
  const button = document.getElementById("generate");

  if (!prompt) {
    message.textContent = "Please enter a video description.";
    return;
  }

  button.disabled = true;
  message.textContent = "Sending your video request to Runway...";

  try {
    const { data, error } = await client.functions.invoke(
      "generate-video",
      {
        body: { prompt, duration, aspectRatio, style }
      }
    );

    if (error) throw error;

    if (!data || !data.taskId) {
      throw new Error("No video task ID was returned.");
    }

    message.textContent =
      "Video task started! Task ID: " + data.taskId +
      ". Status: " + (data.status || "Submitted");

  } catch (error) {
    message.textContent = "Could not start video: " +
      (error.message || "Please try again.");
  } finally {
    button.disabled = false;
  }
};

client.auth.onAuthStateChange(() => {
  refreshSession();
});

refreshSession();
</script>
</body>
</html>
